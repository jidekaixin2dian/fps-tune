name: build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject tracked development documents
        shell: pwsh
        run: |
          $allowed = @('README.md', 'README.en.md', 'SKILL.md')
          $blocked = @(git -c core.quotePath=false ls-files | Where-Object {
            $_ -match '^(docs|dev-docs|development|\.agents|\.codex)/' -or
            ($_ -match '\.(md|rst|adoc|docx?|pdf|html?)$' -and $_ -notin $allowed)
          })
          if ($blocked.Count) { throw ('Local development documents must not be published: ' + ($blocked -join ', ')) }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FpsTune.Wpf.Tests/FpsTune.Wpf.Tests.csproj --locked-mode

      - name: Build
        run: dotnet build FpsTune.Wpf\FpsTune.Wpf.csproj -c Release --no-restore

      - name: Test
        run: dotnet test FpsTune.Wpf.Tests/FpsTune.Wpf.Tests.csproj -c Release --no-restore

      - name: Publish single-file
        run: dotnet publish FpsTune.Wpf\FpsTune.Wpf.csproj -c Release -r win-x64 --self-contained true /p:RestoreLockedMode=true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:IncludeAllContentForSelfExtract=true /p:DebugType=none /p:OutDir=publish-tmp -o dist/ci

      - name: Preserve licenses in CI artifacts
        shell: pwsh
        run: |
          Copy-Item -LiteralPath LICENSE, THIRD-PARTY-NOTICES.txt -Destination dist/ci
          $exe = 'dist/ci/FpsTune.exe'
          $text = (& $exe -License | Out-String).Replace("`r`n", "`n")
          if ($LASTEXITCODE -ne 0) { throw 'Embedded license command failed.' }
          foreach ($file in @('LICENSE', 'THIRD-PARTY-NOTICES.txt')) {
            if (-not $text.Contains([IO.File]::ReadAllText((Join-Path $PWD $file)).Replace("`r`n", "`n").Trim())) { throw "Missing complete text: $file" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FpsTune-windows-x64
          path: dist/ci
