name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked development documents
        shell: pwsh
        run: |
          $allowed = @('README.md', 'README.en.md', 'SKILL.md')
          $blocked = @(git -c core.quotePath=false ls-files | Where-Object {
            $_ -match '^(docs|dev-docs|development|\.agents|\.codex)/' -or
            ($_ -match '\.(md|rst|adoc|docx?|pdf|html?)$' -and $_ -notin $allowed)
          })
          if ($blocked.Count) { throw ('Local development documents must not be published: ' + ($blocked -join ', ')) }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FpsTune.Wpf\FpsTune.Wpf.csproj

      - name: Build
        run: dotnet build FpsTune.Wpf\FpsTune.Wpf.csproj -c Release --no-restore

      - name: Test
        run: dotnet test FpsTune.Wpf.Tests/FpsTune.Wpf.Tests.csproj -c Release

      - name: Publish single-file
        run: dotnet publish FpsTune.Wpf\FpsTune.Wpf.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=none /p:OutDir=publish-tmp -o dist/ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsTune-windows-x64
          path: dist/ci
