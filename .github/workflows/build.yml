name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FpsTune.Wpf\FpsTune.Wpf.csproj

      - name: Build
        run: dotnet build FpsTune.Wpf\FpsTune.Wpf.csproj -c Release --no-restore

      - name: Test
        run: dotnet test FpsTune.Wpf.Tests/FpsTune.Wpf.Tests.csproj -c Release

      - name: Publish single-file
        run: dotnet publish FpsTune.Wpf\FpsTune.Wpf.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=none /p:OutDir=publish-tmp -o dist/ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsTune-windows-x64
          path: dist/ci
