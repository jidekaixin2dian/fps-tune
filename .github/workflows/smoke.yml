name: smoke

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build FpsTune.Wpf/FpsTune.Wpf.csproj -c Release /p:RestoreLockedMode=true

      - name: Core detect (read-only)
        run: ./tools/invoke-cli-check.ps1 -Executable 'FpsTune.Wpf\bin\Release\net10.0-windows\FpsTune.exe' -CliArguments @('-Detect', '-Json')

      # 0.6.0 起 A/B 实验退休（能力并入 GUI「优化 → 对照一下」，判定记录并入收益档案），
      # 这条 smoke 改为验证仍可离线驱动的只读链路：版本、许可全文、备份列表。
      - name: CLI read-only chain
        shell: powershell
        run: |
          $exe = 'FpsTune.Wpf\bin\Release\net10.0-windows\FpsTune.exe'
          $steps = @(
            @('-Version'),
            @('-License'),
            @('-ListRestore', '-Json')
          )
          foreach ($arguments in $steps) {
            ./tools/invoke-cli-check.ps1 -Executable $exe -CliArguments $arguments
          }
