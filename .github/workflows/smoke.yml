name: smoke

on:
  push:
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core detect (read-only)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File fps-tune.ps1 -Detect -Json

      - name: A/B simulated full chain
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'FpsTuneSmoke'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tuning-experiment.ps1 -Simulate -Baseline -Json
          powershell -NoProfile -ExecutionPolicy Bypass -File tuning-experiment.ps1 -Simulate -Test -Group group-1 -Json
          powershell -NoProfile -ExecutionPolicy Bypass -File tuning-experiment.ps1 -Simulate -Test -Group group-2 -Json
          powershell -NoProfile -ExecutionPolicy Bypass -File tuning-experiment.ps1 -Simulate -Test -Group group-3 -Json
          powershell -NoProfile -ExecutionPolicy Bypass -File tuning-experiment.ps1 -Report -Json
