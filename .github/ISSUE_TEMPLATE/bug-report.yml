name: Bug 反馈
description: 报告检测/应用/还原/界面问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请描述现象与复现步骤，附软件版本。只分享与问题相关的输出，隐去个人信息；敏感漏洞先提出不含细节的联系请求。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象 + 期望。有截图更好。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块
      options: [检测, 优化/应用, 还原, 性能会话, A/B 实验, 界面/主题, CLI, 安装/启动, 其他]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 版本（标题栏或 `-Version` 输出）、Windows 版本、是否提权运行、GPU 型号
      value: |
        版本：
        Windows：
        是否以管理员运行：
        GPU：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关输出 / 日志
      description: 可选。检查并打码后粘贴相关片段，不必提交完整日志或诊断包。
      render: shell
  - type: checkboxes
    id: revert
    attributes:
      label: 还原确认
      options:
        - label: 我已尝试还原，并在描述中说明结果
          required: false
